<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Online Food Ordering Website 🍔 </title>
    <style>
        .hover-zoom{
            transition: transform 0.3s ease;
        }
        .hover-zoom:hover{
            transform: scale(1.08);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Sha Hotels🍴😋</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Home</a>
                    </li>
                     <li class="nav-item">
                        <a class="nav-link active" href="#">Menu</a>
                    </li>
                     <li class="nav-item">
                        <a class="nav-link active" href="#">About</a>
                    </li>
                     <li class="nav-item">
                        <a class="nav-link active" href="#">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        <h1 class="text-center fw-bold mb-4">Healthy Food Menu</h1>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">

            <div class="col col-lg-4 col-md-6 col-sm-12">
                <div class="card h-100 ">
                    <img class="card-img-top hover-zoom" src="https://homecookingshow.in/wp-content/uploads/2026/08/Ragi-Roti-640x480.webp" alt="Ragi recipes">
                    <div class="card-body text-center">
                        <h3 class="card-title">Ragi Roti</h3>
                        <h6 class="card-subtitle mb-2 text-muted">₹120</h6>
                        <button class="btn btn-danger">Order Now</button>
                    </div>
                </div>
            </div>

            <div class="col col-lg-4 col-md-6 col-sm-12">
                <div class="card h-100">
                    <img class="card-img-top hover-zoom" src="https://homecookingshow.in/wp-content/uploads/2026/08/Insta_Vegetable-Paneer-Stir-Fry-copy-640x480.webp" alt="paneer recipes">
                    <div class="card-body text-center">
                        <h3 class="card-title">Paneer Veg Stir Fry</h3>
                        <h6 class="card-subtitle mb-2 text-muted">₹200</h6>
                        <button class="btn btn-success">Order Now</button>
                    </div>
                </div>
            </div>

            <div class="col col-lg-4 col-md-6 col-sm-12">
                <div class="card h-100">
                    <img class="card-img-top hover-zoom" src="https://homecookingshow.in/wp-content/uploads/2026/08/Cauliflower-Rice-640x480.webp" alt="cauliflower recipes">
                    <div class="card-body text-center">
                        <h3 class="card-title">Cauliflower Rice</h3>
                        <h6 class="card-subtitle mb-2 text-muted">₹180</h6>
                        <button class="btn btn-info">Order Now</button>
                    </div>
                </div>
            </div>

            <div class="col col-lg-4 col-md-6 col-sm-12">
                <div class="card h-100">
                    <img class="card-img-top hover-zoom" src="https://homecookingshow.in/wp-content/uploads/2026/07/Insta_Garlic-Gravy-copy-640x480.webp" alt="garlic recipes">
                    <div class="card-body text-center">
                        <h3 class="card-title">Garlic Curry</h3>
                        <h6 class="card-subtitle mb-2 text-muted">₹220</h6>
                        <button class="btn btn-warning">Order Now</button>
                    </div>
                </div>
            </div>

            <div class="col col-lg-4 col-md-6 col-sm-12">
                <div class="card h-100">
                    <img class="card-img-top hover-zoom" src="https://homecookingshow.in/wp-content/uploads/2026/07/Cucumber-Pickle-640x480.webp" alt="pickle recipes">
                    <div class="card-body text-center">
                        <h3 class="card-title">Cucumber Pickle</h3>
                        <h6 class="card-subtitle mb-2 text-muted">₹120</h6>
                        <button class="btn btn-success">Order Now</button>
                    </div>
                </div>
            </div>

            <div class="col col-lg-4 col-md-6 col-sm-12">
                <div class="card h-100">
                    <img class="card-img-top hover-zoom" src="https://homecookingshow.in/wp-content/uploads/2026/06/Avial-640x480.webp" alt="avial recipes">
                    <div class="card-body text-center">
                        <h3 class="card-title">Avial</h3>
                        <h6 class="card-subtitle mb-2 text-muted">₹100</h6>
                        <button class="btn btn-secondary">Order Now</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

</html>
